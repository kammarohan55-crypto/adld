<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALP Visualizer</title>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 45% 55%;
            gap: 20px;
            height: calc(100vh - 40px);
        }

        .panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        h1 {
            margin: 0 0 15px 0;
            font-size: 1.8rem;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        h2 {
            font-size: 1.2rem;
            margin: 15px 0 10px 0;
            color: #b8b8d1;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        #editor {
            width: 100%;
            height: 400px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 15px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            color: #fff;
            resize: vertical;
            margin-bottom: 15px;
        }

        #errors {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.3);
            border-radius: 8px;
            padding: 10px;
            max-height: 150px;
            overflow-y: auto;
            display: none;
            margin-bottom: 15px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
        }

        #symbols {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px;
            max-height: 150px;
            overflow-y: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
        }

        .symbol-table {
            width: 100%;
            border-collapse: collapse;
        }

        .symbol-table th,
        .symbol-table td {
            padding: 5px 10px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .symbol-table th {
            color: #b8b8d1;
            font-weight: 600;
        }

        .right-panel {
            display: grid;
            grid-template-rows: auto auto 1fr auto;
            gap: 15px;
        }

        #registers {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
        }

        .register-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
        }

        .register-item {
            background: rgba(102, 126, 234, 0.1);
            padding: 8px;
            border-radius: 5px;
            border: 1px solid rgba(102, 126, 234, 0.3);
            transition: all 0.3s;
        }

        .register-item.updated {
            background: rgba(67, 233, 123, 0.2);
            border-color: rgba(67, 233, 123, 0.5);
            animation: pulse 0.5s;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        .register-name {
            font-weight: 700;
            color: #667eea;
        }

        .register-value {
            color: #fff;
            margin-left: 5px;
        }

        #memory {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
        }

        .memory-table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
        }

        .memory-table th,
        .memory-table td {
            padding: 5px 10px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .memory-table th {
            color: #b8b8d1;
            position: sticky;
            top: 0;
            background: rgba(0, 0, 0, 0.5);
        }

        .memory-row.updated {
            background: rgba(67, 233, 123, 0.1);
            animation: pulse 0.5s;
        }

        #eventLog {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
            max-height: 200px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
        }

        .event-item {
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: #b8b8d1;
        }

        .event-item .event-id {
            color: #667eea;
            margin-right: 10px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 10px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body data-mode="alp">
    <div class="container">
        <!-- Left Panel -->
        <div class="panel">
            <a href="/" class="back-link">← Back to Menu</a>
            <h1>ALP Visualizer</h1>

            <div class="controls">
                <button class="btn-primary" id="assembleBtn">Assemble</button>
                <button class="btn-primary" id="runBtn" disabled>Run</button>
                <button class="btn-secondary" id="stepBtn" disabled>Step</button>
                <button class="btn-secondary" id="stepOverBtn" disabled>Step Over</button>
                <button class="btn-secondary" id="resetBtn">Reset</button>
                <button class="btn-secondary" id="loadSampleBtn">Load Sample</button>
            </div>

            <h2>Source Code</h2>
            <textarea id="editor" spellcheck="false" placeholder="Enter ALP code here..."></textarea>

            <div id="errors"></div>

            <h2>Symbol Table</h2>
            <div id="symbols">
                <em style="color: #666;">No symbols yet. Assemble code first.</em>
            </div>
        </div>

        <!-- Right Panel -->
        <div class="panel right-panel">
            <div>
                <h2>Registers</h2>
                <div id="registers">
                    <div class="register-grid" id="registerGrid"></div>
                </div>
            </div>

            <div>
                <h2>Memory</h2>
                <div id="memory">
                    <table class="memory-table" id="memoryTable">
                        <thead>
                            <tr>
                                <th>Address</th>
                                <th>Hex</th>
                                <th>Decimal</th>
                            </tr>
                        </thead>
                        <tbody id="memoryBody">
                        </tbody>
                    </table>
                </div>
            </div>

            <div id="stack" style="height:300px; overflow:auto;"></div>
            <div id="log" style="height:150px; overflow:auto;"></div>
            <div id="stackView" style="min-height:150px;"></div>
            <div>
                <h2>Event Log</h2>
                <div id="eventLog"></div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='alp_ui.js') }}"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
